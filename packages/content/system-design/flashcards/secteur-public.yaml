- id: preuve-en-cas-de-recours
  situation: En cas de recours, l'administration doit prouver qui a modifié un dossier, et quand.
  categorie: secteur-public
  arbre:
    - mot: journal d'audit
      synonymes: [piste d'audit, audit]
      pourquoi: tracer chaque action significative
      niveau: confirme
      concept: journal-d-audit
      enfants:
        - mot: ajout seul
          synonymes: [append only]
          pourquoi: rien ne s'y modifie ni ne s'y supprime
          niveau: senior
          enfants:
            - mot: chaînage par hash
              synonymes: [hash, chaînage]
              pourquoi: toute altération devient détectable
              niveau: lead

- id: ouverture-d-un-service-public
