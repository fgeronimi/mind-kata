- id: base-saturee-en-lecture
  situation: La base de données sature en lecture, alors qu'un cache est déjà en place.
  categorie: donnees
  arbre:
    - mot: index
      synonymes: [plan d'exécution, explain]
      pourquoi: la première étape, avant d'ajouter de l'infrastructure
      niveau: confirme
      concept: index
      enfants:
        - mot: réplicas
          synonymes: [réplicas en lecture, read replicas, replica]
          pourquoi: répartir les lectures sur des copies de la base
          niveau: senior
          concept: replicas-lecture
          enfants:
            - mot: retard de réplication
              synonymes: [lag de réplication]
              pourquoi: les réplicas sont en retard de quelques millisecondes
              niveau: senior
              enfants:
                - mot: lire ses propres écritures
                  synonymes: [read your writes]
                  pourquoi: un utilisateur doit voir tout de suite sa propre modification
                  niveau: lead
                  concept: read-your-writes

- id: deux-modifications-simultanees
  situation: Deux agents modifient la même fiche en même temps, et la seconde sauvegarde écrase la première sans prévenir.
  categorie: donnees
  arbre:
    - mot: verrouillage optimiste
      synonymes: [optimistic locking]
      pourquoi: refuser la seconde sauvegarde quand la fiche a changé entre-temps
      niveau: senior
      concept: verrouillage-optimiste
      alternatives:
        - mot: verrouillage pessimiste
          synonymes: [select for update]
          condition: conflits fréquents ou très coûteux
      enfants:
        - mot: numéro de version
          synonymes: [version]
          pourquoi: comparer la version lue à la version en base au moment d'écrire
          niveau: senior
        - mot: message à l'utilisateur
          synonymes: [prévenir l'utilisateur]
          pourquoi: celui dont la sauvegarde est refusée doit comprendre et pouvoir reprendre
          niveau: lead

- id: renommer-une-colonne
  situation: Il faut renommer une colonne d'une table de 200 millions de lignes, sans interrompre le service.
  categorie: donnees
  arbre:
    - mot: expand and contract
      synonymes: [élargir puis réduire, parallel change]
      pourquoi: chaque étape reste compatible avec la version du code déjà déployée
      niveau: senior
      concept: expand-and-contract
      enfants:
        - mot: nouvelle colonne
          pourquoi: ajouter avant de retirer
          niveau: senior
          enfants:
            - mot: double écriture
              pourquoi: les deux colonnes restent à jour pendant la transition
              niveau: senior
              enfants:
                - mot: rattrapage par lots
                  synonymes: [backfill, par lots]
                  pourquoi: recopier l'existant sans verrouiller la table
                  niveau: senior
                  enfants:
                    - mot: bascule de la lecture
                      pourquoi: lire la nouvelle colonne une fois le rattrapage fini
                      niveau: lead
        - mot: index en ligne
          synonymes: [concurrently, create index concurrently]
          pourquoi: créer un index sans bloquer les écritures
          niveau: lead
          concept: index

- id: table-qui-grossit
  situation: Une table reçoit 50 millions de lignes par mois, et la base atteint 2 To.
  categorie: donnees
  arbre:
    - mot: index
      pourquoi: vérifier d'abord que les requêtes sont bien indexées
      niveau: confirme
      concept: index
      enfants:
        - mot: partitionnement
          synonymes: [partition, partitionner par date]
          pourquoi: découper par date pour purger et archiver facilement
          niveau: senior
          concept: partitionnement
          enfants:
            - mot: archivage
              synonymes: [archiver, stockage froid]
              pourquoi: sortir l'historique de la base chaude
              niveau: senior
            - mot: sharding
              pourquoi: en dernier recours, on partitionne avant de sharder
              niveau: lead

- id: magasins-a-proximite
  situation: Il faut afficher les magasins situés à moins de 5 km de l'utilisateur.
  categorie: donnees
  arbre:
    - mot: postgis
      synonymes: [extension géographique, recherche géographique]
      pourquoi: des fonctions de distance dans la base
      niveau: senior
      alternatives:
        - mot: moteur de recherche
          synonymes: [elasticsearch, opensearch]
          condition: recherche géographique combinée à du texte et des filtres
      enfants:
        - mot: index spatial
          synonymes: [gist, index géographique]
          pourquoi: ne pas calculer la distance de chaque magasin
          niveau: senior
          concept: index
        - mot: geohash
          pourquoi: découper le territoire en cases, pratique pour le cache
          niveau: lead

- id: grand-compte-donnees-separees
  situation: Un très gros client exige que ses données soient isolées de celles des autres clients.
  categorie: donnees
  arbre:
    - mot: multi-tenant
      synonymes: [multi tenant, multi locataire]
      pourquoi: choisir le modèle d'isolation selon l'exigence
      niveau: senior
      concept: multi-tenant
      enfants:
        - mot: row level security
          synonymes: [sécurité au niveau des lignes, rls]
          pourquoi: base partagée, la base filtre elle-même par client
          niveau: senior
          concept: row-level-security
        - mot: schéma par client
          pourquoi: un cloisonnement plus fort, toujours dans la même base
          niveau: senior
        - mot: base dédiée
          synonymes: [silo]
          pourquoi: seulement sur exigence contractuelle ou volume hors norme
          niveau: lead
        - mot: cmek
          synonymes: [clés gérées par le client]
          pourquoi: le client garde la main sur les clés de chiffrement
          niveau: lead
          concept: chiffrement

- id: memoire-saturee-traitement
  situation: Un traitement charge des millions de lignes et la mémoire du serveur sature.
  categorie: donnees
  arbre:
    - mot: traitement par lots
      synonymes: [par lots, batch, paquets]
      pourquoi: ne jamais tout charger en mémoire d'un coup
      niveau: confirme
      enfants:
        - mot: itérateur
          synonymes: [générateur, yield, curseur, flux]
          pourquoi: lire en flux, ligne par ligne
          niveau: senior
        - mot: vider le contexte
          synonymes: [clear, détacher]
          pourquoi: l'ORM garde tout en mémoire tant qu'on ne libère pas
          niveau: senior

- id: recherche-avec-fautes
  situation: Les utilisateurs cherchent avec des fautes de frappe ou des mots incomplets, et ne trouvent rien.
  categorie: donnees
  arbre:
    - mot: recherche floue
      synonymes: [fuzzy search, levenshtein]
      pourquoi: tolérer une ou deux fautes
      niveau: senior
      concept: recherche-floue
      enfants:
        - mot: n-grammes
          synonymes: [ngrammes, edge ngram, autocomplétion]
          pourquoi: retrouver les mots partiels, pour l'autocomplétion
          niveau: senior
        - mot: moteur de recherche
          synonymes: [elasticsearch, opensearch, meilisearch, pg trgm]
          pourquoi: des index faits pour ça, alimentés depuis la base
          niveau: senior
          concept: cdc

- id: suppression-sur-six-services
  situation: Un usager demande la suppression de ses données, présentes dans six services et dans les sauvegardes.
  categorie: donnees
  arbre:
    - mot: événement de suppression
      synonymes: [événement, pub sub]
      pourquoi: prévenir chaque service qui détient des données
      niveau: senior
      concept: pub-sub
      enfants:
        - mot: suivi des confirmations
          synonymes: [confirmations]
          pourquoi: prouver que chaque service a bien supprimé
          niveau: lead
    - mot: crypto-shredding
      synonymes: [destruction cryptographique, destruction de la clé]
      pourquoi: rendre les données illisibles jusque dans les sauvegardes
      niveau: lead
      concept: crypto-shredding
    - mot: registre des traitements
      synonymes: [registre, dpo]
      pourquoi: savoir où sont les données, et qui s'en occupe
      niveau: lead
