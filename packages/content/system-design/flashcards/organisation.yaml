- id: projet-en-retard
  situation: Le projet a deux mois de retard, et la direction propose d'ajouter quatre développeurs.
  categorie: organisation
  arbre:
    - mot: loi de brooks
      synonymes: [brooks]
      pourquoi: ajouter des personnes à un projet en retard le retarde encore
      niveau: senior
      concept: lois-de-brooks-et-amdahl
      enfants:
        - mot: réduire le périmètre
          synonymes: [périmètre, prioriser]
