name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau push sur une PR rend la vérification précédente obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par SHA : une étiquette peut être déplacée, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version lue dans le champ packageManager du package.json racine.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make install
      - run: make check
      - run: make build
